name: pet-activity
version: 1.0.0
description: "Publishes the Hermes pet animation state (idle/run/review/wave/jump/failed/waiting) to ~/.hermes/pets/activity-state.json so external companions (e.g. the Omarchy desktop pet) can mirror what the agent's pet is doing."
author: madmasx
provides_hooks:
  - pre_llm_call
  - post_llm_call
  - pre_api_request
  - post_api_request
  - api_request_error
  - pre_tool_call
  - post_tool_call
  - pre_approval_request
  - post_approval_response
  - pre_verify
  - agent_loop_stopped
  - subagent_stop
  - on_session_start
  - on_session_end
  - on_session_finalize
